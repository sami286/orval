openapi: 3.0.0
info:
  title: Dates transform
  version: 1.0.0
paths:
  /auctions/{auctionId}:
    get:
      operationId: getAuctionDetails
      parameters:
        - name: auctionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionDetails'
  /auctions/{auctionId}/summary:
    get:
      operationId: getAuctionSummary
      parameters:
        - name: auctionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EnglishAuctionSummary'
                  - $ref: '#/components/schemas/DutchAuctionSummary'
                discriminator:
                  propertyName: auctionType
                  mapping:
                    english: '#/components/schemas/EnglishAuctionSummary'
                    dutch: '#/components/schemas/DutchAuctionSummary'
  /auctions:
    get:
      operationId: listAuctionNames
      responses:
        '200':
          description: dates-free — must generate no deserializer
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
components:
  schemas:
    EnglishAuctionSummary:
      type: object
      required: [auctionType, startTime]
      properties:
        auctionType: { type: string, enum: [english] }
        startTime: { type: string, format: date-time }
    DutchAuctionSummary:
      type: object
      required: [auctionType]
      properties:
        auctionType: { type: string, enum: [dutch] }
        endTime: { type: string, format: date-time, nullable: true }
    AuctionDetails:
      type: object
      required: [startTime, log]
      properties:
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }
        name: { type: string }
        log:
          type: array
          items:
            $ref: '#/components/schemas/LogEvent'
    LogEvent:
      type: object
      required: [createdAt]
      properties:
        createdAt: { type: string, format: date-time }
        message: { type: string }
